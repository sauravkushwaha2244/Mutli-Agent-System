version: '3.8'

services:
  researchmind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchmind-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENROUTER_CHEAP_MODEL=${OPENROUTER_CHEAP_MODEL:-google/gemini-2.5-flash}
      - OPENROUTER_STRONG_MODEL=${OPENROUTER_STRONG_MODEL:-openai/gpt-4o-mini}
    volumes:
      - cache_data:/app/.cache
    restart: unless-stopped

volumes:
  cache_data:
